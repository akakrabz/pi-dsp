# pifx: a permanent dummy output called "pi-dsp".
# Installed by `./install.sh --system-audio` into ~/.config/pipewire/pipewire.conf.d/.
#
# Apps play into it like any speaker; pifx records its monitor, runs the effects and
# plays the result on the real outputs (the DAC...). It shows up in the desktop's sound
# menu, and its volume slider sets the level going into pifx. pifx makes it the default
# output while system audio is routed through it, and puts the old default back when
# it stops.
context.objects = [
    {   factory = adapter
        args = {
            factory.name     = support.null-audio-sink
            node.name        = "pi_dsp"
            node.description = "pi-dsp"
            media.class      = Audio/Sink
            audio.position   = [ FL FR ]
            monitor.channel-volumes = true
            monitor.passthrough     = true
        }
    }
]
