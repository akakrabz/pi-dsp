# pifx: smaller PipeWire buffers (256 frames = 5.3 ms at 48 kHz instead of 1024).
# System audio takes a few hops on its way through pifx (app -> pi-dsp -> pifx -> DAC);
# small buffers keep the total low enough for lip sync on video.
# If you hear crackles, raise both to 512.
context.properties = {
    default.clock.quantum     = 256
    default.clock.min-quantum = 256
}
